# dbt profiles. Default target is local DuckDB (zero setup, used for demos/tests).
# run_dbt_models.py picks the target from the environment (see warehouse_config.py);
# the Airflow DAG uses the DBT_TARGET env var.
ecommerce:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../warehouse.duckdb') }}"
      schema: main
      threads: 4

    # BigQuery with a service-account JSON key (GOOGLE_APPLICATION_CREDENTIALS)
    bigquery:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      project: "{{ env_var('GCP_PROJECT', 'my-gcp-project') }}"
      dataset: staging
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4

    # BigQuery with `gcloud auth application-default login`
    bigquery_oauth:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'my-gcp-project') }}"
      dataset: staging
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
