# Apache Airflow Docker-Compose Configuration
# For running official Airflow Webserver, Scheduler, and Postgres metadata DB

x-airflow-common:
  &airflow-common
  build: .
  image: ecommerce-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    PYTHONPATH: /opt/airflow
    DBT_TARGET: ${DBT_TARGET:-duckdb}
    GCP_PROJECT: ${GCP_PROJECT:-}
    BQ_LOCATION: ${BQ_LOCATION:-US}
    GOOGLE_APPLICATION_CREDENTIALS: ${AIRFLOW_GCP_KEY:-}
    DBT_DIR: /opt/airflow/dbt_ecommerce
    DBT_BIN: /home/airflow/dbt_venv/bin/dbt
    DUCKDB_PATH: /opt/airflow/warehouse.duckdb
    AIRBYTE_URL: ${AIRBYTE_URL:-http://host.docker.internal:8000}
    AIRBYTE_CLIENT_ID: ${AIRBYTE_CLIENT_ID:-}
    AIRBYTE_CLIENT_SECRET: ${AIRBYTE_CLIENT_SECRET:-}
    AIRBYTE_USERNAME: ${AIRBYTE_USERNAME:-}
    AIRBYTE_PASSWORD: ${AIRBYTE_PASSWORD:-}
    AIRBYTE_CONNECTION_ID: ${AIRBYTE_CONNECTION_ID:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../data_source:/opt/airflow/data_source
    - ../dbt_ecommerce:/opt/airflow/dbt_ecommerce
    - ../ingestion:/opt/airflow/ingestion
    - ../pipeline_tasks.py:/opt/airflow/pipeline_tasks.py
    - ../warehouse_config.py:/opt/airflow/warehouse_config.py
    - ./secrets:/opt/airflow/secrets:ro
    - ../warehouse.duckdb:/opt/airflow/warehouse.duckdb
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
